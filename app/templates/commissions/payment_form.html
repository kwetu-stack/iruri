{% extends "layouts/dashboard.html" %}
{% block title %}Record Commission Payment | IRURI{% endblock %}
{% block dashboard_content %}<div class="card shadow-sm border-0"><div class="card-header"><h3 class="mb-0">Record Commission Payment</h3></div><div class="card-body"><p class="text-muted">{{ commission.commission_number }} | Outstanding: {{ '{:,.2f}'.format(commission.balance) }}</p><form method="POST"><div class="mb-3"><label class="form-label" for="payment_date">Payment Date</label><input class="form-control" id="payment_date" name="payment_date" type="date" value="{{ request.form.get('payment_date', today) }}" required></div><div class="mb-3"><label class="form-label" for="amount">Amount</label><input class="form-control" id="amount" name="amount" type="number" min="0.01" max="{{ commission.balance }}" step="0.01" required></div><div class="mb-3"><label class="form-label" for="reference_number">Reference Number</label><input class="form-control" id="reference_number" name="reference_number" value="{{ request.form.get('reference_number', '') }}"></div><div class="mb-3"><label class="form-label" for="notes">Notes</label><textarea class="form-control" id="notes" name="notes" rows="3">{{ request.form.get('notes', '') }}</textarea></div><button class="btn btn-primary" type="submit">Record Payment</button> <a class="btn btn-secondary" href="{{ url_for('commissions.details', id=commission.id) }}">Cancel</a></form></div></div>{% endblock %}
