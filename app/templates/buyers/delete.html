{% extends "layouts/dashboard.html" %}
{% block title %}Delete Buyer | IRURI{% endblock %}
{% block dashboard_content %}
<div class="row justify-content-center"><div class="col-lg-6"><div class="card shadow-sm border-danger"><div class="card-header text-danger"><h3 class="mb-0">Delete Buyer</h3></div><div class="card-body"><p>Are you sure you want to delete <strong>{{ buyer.full_name or buyer.company_name }}</strong> ({{ buyer.buyer_number }})?</p><p class="text-muted">This action cannot be undone.</p><form method="POST"><button type="submit" class="btn btn-danger">Delete Buyer</button> <a href="{{ url_for('buyers.details', id=buyer.id) }}" class="btn btn-secondary">Cancel</a></form></div></div></div></div>
{% endblock %}
