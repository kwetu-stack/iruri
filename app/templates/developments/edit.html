{% extends "layouts/dashboard.html" %}
{% block title %}Edit Development | IRURI{% endblock %}
{% block dashboard_content %}
<div class="row justify-content-center"><div class="col-lg-9"><div class="card shadow-sm"><div class="card-header"><h3 class="mb-0">Edit Development</h3></div><div class="card-body"><form method="POST" enctype="multipart/form-data"><div class="row"><div class="col-md-6 mb-3"><label class="form-label" for="developer_id">Developer</label><select name="developer_id" id="developer_id" class="form-select" required>{% for developer_item in developers %}<option value="{{ developer_item.id }}"{% if request.form.get('developer_id', development.developer_id|string) == developer_item.id|string %} selected{% endif %}>{{ developer_item.company_name }}</option>{% endfor %}</select></div><div class="col-md-6 mb-3"><label class="form-label" for="name">Development Name</label><input name="name" id="name" class="form-control" value="{{ request.form.get('name', development.name) }}" required></div><div class="col-md-6 mb-3"><label class="form-label" for="county">County</label><input name="county" id="county" class="form-control" value="{{ request.form.get('county', development.county) }}" required></div><div class="col-md-6 mb-3"><label class="form-label" for="town">Town</label><input name="town" id="town" class="form-control" value="{{ request.form.get('town', development.town) }}" required></div><div class="col-md-6 mb-3"><label class="form-label" for="neighbourhood">Neighbourhood</label><input name="neighbourhood" id="neighbourhood" class="form-control" value="{{ request.form.get('neighbourhood', development.neighbourhood or '') }}"></div><div class="col-md-6 mb-3"><label class="form-label" for="property_type">Property Type</label><select name="property_type" id="property_type" class="form-select" required>{% for value in property_types %}<option{% if request.form.get('property_type', development.property_type) == value %} selected{% endif %}>{{ value }}</option>{% endfor %}</select></div><div class="col-md-6 mb-3"><label class="form-label" for="status">Status</label><select name="status" id="status" class="form-select" required>{% for value in statuses %}<option{% if request.form.get('status', development.status) == value %} selected{% endif %}>{{ value }}</option>{% endfor %}</select></div><div class="col-md-6 mb-3"><label class="form-label" for="completion_date">Completion Date</label><input type="date" name="completion_date" id="completion_date" class="form-control" value="{{ request.form.get('completion_date', development.completion_date.isoformat() if development.completion_date else '') }}"></div><div class="col-md-6 mb-3"><label class="form-label" for="starting_price">Starting Price</label><input type="number" name="starting_price" id="starting_price" class="form-control" min="0" step="0.01" value="{{ request.form.get('starting_price', development.starting_price or '') }}"></div></div><div class="mb-3"><label class="form-label" for="description">Description</label><textarea name="description" id="description" class="form-control" rows="4">{{ request.form.get('description', development.description or '') }}</textarea></div>{% if development.cover_image %}<p class="small text-muted mb-2">Current cover image</p><img src="{{ url_for('static', filename='uploads/developments/' ~ development.cover_image) }}" alt="{{ development.name }}" class="rounded mb-3" width="180" height="110" style="object-fit: cover;">{% endif %}<div class="mb-4"><label class="form-label" for="cover_image">Replace Cover Image</label><input type="file" name="cover_image" id="cover_image" class="form-control" accept=".jpg,.jpeg,.png,.webp"></div><button type="submit" class="btn btn-primary">Save Changes</button> <a href="{{ url_for('developments.admin_detail', id=development.id) }}" class="btn btn-secondary">Cancel</a></form></div></div></div></div>
{% endblock %}
