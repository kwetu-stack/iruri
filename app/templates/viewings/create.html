{% extends "layouts/dashboard.html" %}
{% block title %}Request Viewing | IRURI{% endblock %}
{% block dashboard_content %}
<div class="d-flex justify-content-between align-items-center mb-4"><h2 class="mb-0">Request Viewing</h2><a href="{{ url_for('viewings.index') }}" class="btn btn-outline-secondary">View Requests</a></div>
<form method="POST" class="card shadow-sm border-0"><div class="card-body">
    <div class="row g-3">
        <div class="col-md-6"><label class="form-label" for="buyer_id">Buyer</label><select class="form-select" id="buyer_id" name="buyer_id" required><option value="">Select buyer</option>{% for buyer in buyers %}<option value="{{ buyer.id }}" {% if request.args.get('buyer_id', type=int) == buyer.id %}selected{% endif %}>{{ buyer.full_name or buyer.company_name }} ({{ buyer.buyer_number }})</option>{% endfor %}</select></div>
        <div class="col-md-6"><label class="form-label" for="property_id">Property</label><select class="form-select" id="property_id" name="property_id" required><option value="">Select property</option>{% for property in properties %}<option value="{{ property.id }}" {% if request.args.get('property_id', type=int) == property.id %}selected{% endif %}>{{ property.title }} ({{ property.listing_number }})</option>{% endfor %}</select></div>
        <div class="col-md-6"><label class="form-label" for="requested_date">Preferred Date</label><input class="form-control" type="date" id="requested_date" name="requested_date" min="{{ today.isoformat() }}" required></div>
        <div class="col-md-6"><label class="form-label" for="requested_time">Preferred Time</label><input class="form-control" type="time" id="requested_time" name="requested_time" required></div>
        <div class="col-12"><label class="form-label" for="message">Optional Message</label><textarea class="form-control" id="message" name="message" rows="4"></textarea></div>
    </div>
</div><div class="card-footer bg-white d-flex gap-2"><button type="submit" class="btn btn-primary">Submit</button><a href="{{ url_for('viewings.index') }}" class="btn btn-secondary">Cancel</a></div></form>
{% endblock %}
