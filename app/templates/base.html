<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
        {% block title %}IRURI™{% endblock %}
    </title>

    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="bg-light">

{% block header %}
<nav class="navbar navbar-dark iruri-navbar shadow-sm">

    <div class="container">

        <a class="navbar-brand fw-bold d-flex align-items-center" href="{{ url_for('dashboard.index') }}">

            <img
                src="{{ url_for('static', filename='img/iruri-logo.png') }}"
                alt="IRURI"
                class="iruri-header-logo me-2"
            >

            <span>IRURI™ Property Marketplace</span>

        </a>

    </div>

</nav>
{% endblock %}

<div class="container mt-4">

    {% block flash %}
    {% include "partials/flash_messages.html" %}
    {% endblock %}

    {% block content %}
    {% endblock %}

</div>

<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
