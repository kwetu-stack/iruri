{% extends "layouts/dashboard.html" %}
{% block title %}Make Offer | IRURI{% endblock %}
{% block dashboard_content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-sm">
            <div class="card-header"><h3 class="mb-0">Make Offer</h3></div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Buyer</label>
                        <input class="form-control" value="{{ buyer.full_name or buyer.company_name }} ({{ buyer.buyer_number }})" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Property</label>
                        {% if property %}
                        <input class="form-control" value="{{ property.title }} ({{ property.listing_number }})" readonly>
                        <input type="hidden" name="property_id" value="{{ property.id }}">
                        {% else %}
                        <select name="property_id" class="form-select" required>
                            <option value="">Select property...</option>
                            {% for item in properties %}<option value="{{ item.id }}">{{ item.title }} ({{ item.listing_number }})</option>{% endfor %}
                        </select>
                        {% endif %}
                    </div>
                    <div class="row">
                        <div class="col-md-8 mb-3">
                            <label class="form-label" for="offered_price">Offer Amount</label>
                            <input id="offered_price" name="offered_price" type="number" min="0.01" step="0.01" class="form-control" value="{{ request.form.get('offered_price', '') }}" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label" for="currency">Currency</label>
                            <input id="currency" name="currency" class="form-control" maxlength="10" value="{{ request.form.get('currency', property.currency if property else 'KES') }}" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="buyer_message">Optional Message</label>
                        <textarea id="buyer_message" name="buyer_message" class="form-control" rows="4">{{ request.form.get('buyer_message', '') }}</textarea>
                    </div>
                    <div class="d-flex gap-2"><button type="submit" class="btn btn-primary">Submit</button><a href="{{ url_for('properties.details', id=property.id) if property else url_for('properties.index') }}" class="btn btn-secondary">Cancel</a></div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
