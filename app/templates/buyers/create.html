{% extends "layouts/dashboard.html" %}
{% block title %}Add Buyer | IRURI{% endblock %}
{% block dashboard_content %}
<div class="row justify-content-center"><div class="col-lg-10"><div class="card shadow-sm"><div class="card-header"><h3 class="mb-0">Add New Buyer</h3></div><div class="card-body"><form method="POST" enctype="multipart/form-data">
{% include "buyers/_form.html" %}
<div class="mb-3"><label class="form-label" for="profile_photo">Profile Photo</label><input type="file" name="profile_photo" id="profile_photo" class="form-control" accept=".jpg,.jpeg,.png,.webp"></div><div class="form-check mb-3"><input type="checkbox" name="verified" id="verified" class="form-check-input" {% if request.form.get('verified') == 'on' %}checked{% endif %}><label class="form-check-label" for="verified">Verified</label></div><div class="form-check mb-4"><input type="checkbox" name="active" id="active" class="form-check-input" {% if not request.form or request.form.get('active') == 'on' %}checked{% endif %}><label class="form-check-label" for="active">Active</label></div><button type="submit" class="btn btn-primary">Save Buyer</button> <a href="{{ url_for('buyers.index') }}" class="btn btn-secondary">Cancel</a>
</form></div></div></div></div>
{% endblock %}
