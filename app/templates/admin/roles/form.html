{% extends "layouts/dashboard.html" %}
{% block title %}{{ "Edit" if role else "Create" }} Role | IRURI{% endblock %}
{% block dashboard_content %}
<div class="card shadow-sm border-0"><div class="card-body">
<h2 class="mb-4">{{ "Edit" if role else "Create" }} role</h2>
<form method="post">
<label class="form-label" for="name">Name</label><input class="form-control mb-3" id="name" name="name" required value="{{ role.name if role else '' }}">
<label class="form-label" for="description">Description</label><textarea class="form-control mb-3" id="description" name="description" rows="3">{{ role.description if role else '' }}</textarea>
{% if role %}<div class="form-check mb-4"><input class="form-check-input" type="checkbox" id="is_active" name="is_active" {% if role.is_active %}checked{% endif %}><label class="form-check-label" for="is_active">Role is active</label></div>{% endif %}
<button class="btn btn-primary" type="submit">Save role</button> <a class="btn btn-outline-secondary" href="{{ url_for('admin.roles_index') }}">Cancel</a>
</form></div></div>
{% endblock %}
