{% extends "layouts/dashboard.html" %}
{% block title %}{{ 'Edit' if template else 'Create' }} Email Template | IRURI{% endblock %}
{% block dashboard_content %}
<div class="card shadow-sm border-0"><div class="card-body"><h2>{{ 'Edit' if template else 'Create' }} Email Template</h2><form method="post"><div class="row g-3"><div class="col-md-6"><label class="form-label" for="template_key">Template Key</label><input class="form-control" id="template_key" name="template_key" value="{{ values.template_key }}" required></div><div class="col-md-6"><label class="form-label" for="template_name">Template Name</label><input class="form-control" id="template_name" name="template_name" value="{{ values.template_name }}" required></div><div class="col-md-6"><label class="form-label" for="category">Category</label><select class="form-select" id="category" name="category" required>{% for category in categories %}<option value="{{ category }}" {% if values.category == category %}selected{% endif %}>{{ category }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label" for="subject">Subject</label><input class="form-control" id="subject" name="subject" value="{{ values.subject }}" required></div><div class="col-12"><label class="form-label" for="body_html">HTML Body</label><textarea class="form-control" id="body_html" name="body_html" rows="8" required>{{ values.body_html }}</textarea></div><div class="col-12"><label class="form-label" for="body_text">Plain Text Body</label><textarea class="form-control" id="body_text" name="body_text" rows="6">{{ values.body_text }}</textarea></div><div class="col-12"><label class="form-label" for="description">Description</label><textarea class="form-control" id="description" name="description" rows="2">{{ values.description }}</textarea></div><div class="col-12 form-check ms-2"><input class="form-check-input" type="checkbox" id="is_active" name="is_active" {% if values.is_active %}checked{% endif %}><label class="form-check-label" for="is_active">Active</label></div></div><button class="btn btn-primary mt-4" type="submit">Save Template</button> <a class="btn btn-outline-secondary mt-4" href="{{ url_for('admin.email_templates_index') }}">Cancel</a></form></div></div>
{% endblock %}
