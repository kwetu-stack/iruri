{% extends "layouts/dashboard.html" %}
{% block title %}Create Reservation | IRURI{% endblock %}
{% block dashboard_content %}
<div class="card shadow-sm border-0"><div class="card-body">
    <h3 class="mb-3">Create Reservation</h3>
    <p class="text-muted">{{ offer.property.title }} · {{ offer.offer_number }}</p>
    <form method="POST">
        <div class="row g-3">
            <div class="col-md-6"><label class="form-label" for="reservation_fee">Reservation Fee</label><input class="form-control" id="reservation_fee" name="reservation_fee" type="number" min="0" step="0.01" value="{{ request.form.get('reservation_fee', '0.00') }}" required></div>
            <div class="col-md-6"><label class="form-label" for="currency">Currency</label><input class="form-control" id="currency" name="currency" maxlength="10" value="{{ request.form.get('currency', offer.currency) }}" required></div>
            <div class="col-md-6"><label class="form-label" for="expiry_date">Expiry Date</label><input class="form-control" id="expiry_date" name="expiry_date" type="date" min="{{ reservation_date.strftime('%Y-%m-%d') }}" value="{{ request.form.get('expiry_date', '') }}" required></div>
            <div class="col-12"><label class="form-label" for="notes">Notes</label><textarea class="form-control" id="notes" name="notes" rows="4">{{ request.form.get('notes', '') }}</textarea></div>
        </div>
        <div class="d-flex gap-2 mt-4"><button class="btn btn-primary" type="submit">Create Reservation</button><a class="btn btn-secondary" href="{{ url_for('offers.review', id=offer.id) }}">Cancel</a></div>
    </form>
</div></div>
{% endblock %}
