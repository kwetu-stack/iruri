{% extends "layouts/dashboard.html" %}
{% block title %}{{ 'Edit' if payment else 'Record' }} Payment | IRURI{% endblock %}
{% block dashboard_content %}
<div class="card shadow-sm border-0"><div class="card-header"><h3 class="mb-0">{{ 'Edit' if payment else 'Record' }} Payment</h3></div><div class="card-body">
<p class="text-muted">{{ agreement.agreement_number }} | {{ agreement.property.title }}</p>
<form method="POST"><div class="row g-3">
<div class="col-md-6"><label class="form-label" for="payment_date">Payment Date</label><input class="form-control" id="payment_date" name="payment_date" type="date" required value="{{ request.form.get('payment_date', payment.payment_date.isoformat() if payment else today) }}"></div>
<div class="col-md-6"><label class="form-label" for="payment_type">Payment Type</label><select class="form-select" id="payment_type" name="payment_type" required>{% for option in payment_types %}<option value="{{ option }}" {{ 'selected' if request.form.get('payment_type', payment.payment_type if payment else '') == option }}>{{ option }}</option>{% endfor %}</select></div>
<div class="col-md-6"><label class="form-label" for="payment_method">Payment Method</label><select class="form-select" id="payment_method" name="payment_method" required>{% for option in payment_methods %}<option value="{{ option }}" {{ 'selected' if request.form.get('payment_method', payment.payment_method if payment else '') == option }}>{{ option }}</option>{% endfor %}</select></div>
<div class="col-md-6"><label class="form-label" for="amount">Amount</label><input class="form-control" id="amount" name="amount" type="number" min="0.01" step="0.01" required value="{{ request.form.get('amount', payment.amount if payment else '') }}"></div>
<div class="col-md-6"><label class="form-label" for="currency">Currency</label><input class="form-control" id="currency" name="currency" maxlength="10" readonly value="{{ agreement.currency }}"></div>
<div class="col-md-6"><label class="form-label" for="reference_number">Reference Number</label><input class="form-control" id="reference_number" name="reference_number" maxlength="100" value="{{ request.form.get('reference_number', payment.reference_number if payment else '') }}"></div>
<div class="col-md-6"><label class="form-label" for="receipt_number">Receipt Number</label><input class="form-control" id="receipt_number" name="receipt_number" maxlength="100" value="{{ request.form.get('receipt_number', payment.receipt_number if payment else '') }}"></div>
<div class="col-12"><label class="form-label" for="notes">Notes</label><textarea class="form-control" id="notes" name="notes" rows="4">{{ request.form.get('notes', payment.notes if payment else '') }}</textarea></div>
</div><div class="d-flex gap-2 mt-4"><button class="btn btn-primary" type="submit">{{ 'Save Changes' if payment else 'Record Payment' }}</button><a class="btn btn-secondary" href="{{ url_for('sale_agreements.details', id=agreement.id) }}">Cancel</a></div></form>
</div></div>
{% endblock %}
