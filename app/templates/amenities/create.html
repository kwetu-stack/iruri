{% extends "layouts/dashboard.html" %}
{% block title %}Add Amenity | IRURI™{% endblock %}
{% block dashboard_content %}
<div class="row justify-content-center"><div class="col-lg-6"><div class="card shadow-sm"><div class="card-header"><h3 class="mb-0">Add Amenity</h3></div><div class="card-body"><form method="POST"><div class="mb-3"><label class="form-label" for="name">Name</label><input type="text" name="name" id="name" class="form-control" value="{{ request.form.get('name', '') }}" required></div><div class="mb-3"><label class="form-label" for="icon">Icon</label><input type="text" name="icon" id="icon" class="form-control" value="{{ request.form.get('icon', '') }}"></div><div class="mb-4"><label class="form-label" for="category">Category</label><input type="text" name="category" id="category" class="form-control" value="{{ request.form.get('category', '') }}"></div><button type="submit" class="btn btn-primary">Save Amenity</button> <a href="{{ url_for('properties.amenities_index') }}" class="btn btn-secondary">Cancel</a></form></div></div></div></div>
{% endblock %}
