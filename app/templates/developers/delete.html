{% extends "layouts/dashboard.html" %}
{% block title %}Delete Developer | IRURI{% endblock %}
{% block dashboard_content %}
<div class="row justify-content-center"><div class="col-lg-6"><div class="card shadow-sm border-danger"><div class="card-header text-danger"><h3 class="mb-0">Delete Developer</h3></div><div class="card-body"><p>Are you sure you want to delete <strong>{{ developer.company_name }}</strong> ({{ developer.developer_number }})?</p><p class="text-muted">This action cannot be undone.</p><form method="POST"><button type="submit" class="btn btn-danger">Delete Developer</button> <a href="{{ url_for('developers.details', id=developer.id) }}" class="btn btn-secondary">Cancel</a></form></div></div></div></div>
{% endblock %}
