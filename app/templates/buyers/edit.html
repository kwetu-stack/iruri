{% extends "layouts/dashboard.html" %}
{% block title %}Edit Buyer | IRURI{% endblock %}
{% block dashboard_content %}
<div class="row justify-content-center"><div class="col-lg-10"><div class="card shadow-sm"><div class="card-header"><h3 class="mb-0">Edit Buyer</h3></div><div class="card-body"><form method="POST" enctype="multipart/form-data">
{% include "buyers/_form.html" %}
{% if buyer.profile_photo %}<p class="small text-muted mb-2">Current profile photo</p><img src="{{ url_for('static', filename='uploads/buyers/' ~ buyer.profile_photo) }}" alt="Buyer photo" class="rounded mb-3" width="100" height="100" style="object-fit: cover;">{% endif %}<div class="mb-3"><label class="form-label" for="profile_photo">Replace Profile Photo</label><input type="file" name="profile_photo" id="profile_photo" class="form-control" accept=".jpg,.jpeg,.png,.webp"></div><div class="form-check mb-3"><input type="checkbox" name="verified" id="verified" class="form-check-input" {% if request.form.get('verified') == 'on' or (not request.form and buyer.verified) %}checked{% endif %}><label class="form-check-label" for="verified">Verified</label></div><div class="form-check mb-4"><input type="checkbox" name="active" id="active" class="form-check-input" {% if request.form.get('active') == 'on' or (not request.form and buyer.active) %}checked{% endif %}><label class="form-check-label" for="active">Active</label></div><button type="submit" class="btn btn-primary">Save Changes</button> <a href="{{ url_for('buyers.details', id=buyer.id) }}" class="btn btn-secondary">Cancel</a>
</form></div></div></div></div>
{% endblock %}
