{% extends "layouts/dashboard.html" %}

{% block title %}Add Property Video | IRURI™{% endblock %}

{% block dashboard_content %}
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
    <div>
        <h2 class="mb-1">Add Property Video</h2>
        <p class="text-muted mb-0">Upload a video or add a YouTube or Vimeo link.</p>
    </div>
    <a href="{{ url_for('properties.details', id=property.id) }}" class="btn btn-secondary">Back to Property</a>
</div>

<div class="card shadow-sm border-0">
    <div class="card-body">
        <form method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="video_type" class="form-label">Video Source</label>
                <select id="video_type" name="video_type" class="form-select" required>
                    <option value="">Select a source</option>
                    <option value="upload" {% if request.form.get('video_type') == 'upload' %}selected{% endif %}>Upload Video</option>
                    <option value="external" {% if request.form.get('video_type') == 'external' %}selected{% endif %}>External Video</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input id="title" name="title" type="text" class="form-control" maxlength="200" value="{{ request.form.get('title', '') }}" required>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Description <span class="text-muted">(optional)</span></label>
                <textarea id="description" name="description" class="form-control" rows="4">{{ request.form.get('description', '') }}</textarea>
            </div>
            <div class="mb-3">
                <label for="file" class="form-label">Video File</label>
                <input id="file" name="file" type="file" class="form-control" accept=".mp4,.webm,.mov">
                <div class="form-text">MP4, WEBM, or MOV. Maximum 100 MB.</div>
            </div>
            <div class="mb-3">
                <label for="external_url" class="form-label">YouTube or Vimeo URL</label>
                <input id="external_url" name="external_url" type="url" class="form-control" maxlength="500" value="{{ request.form.get('external_url', '') }}" placeholder="https://www.youtube.com/watch?v=...">
            </div>
            <button type="submit" class="btn btn-primary">Save Video</button>
        </form>
    </div>
</div>
{% endblock %}
